<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seanify</title>
  <link rel="stylesheet" href="/mini.css">
</head>
<body>
  <div class="pip">
    <div class="media">
      <div class="cover" id="cover"></div>
      <div class="edge"><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Seek"></div>
      <div class="hover">
        <button type="button" class="ctrl" id="prev" aria-label="Previous">
          <svg viewBox="0 0 16 16"><path d="M3.3 2.5v11h1.6v-4.2L13 13.5V2.5L4.9 6.7V2.5H3.3z"/></svg>
        </button>
        <button type="button" class="play" id="play" aria-label="Play">
          <svg id="play-icon" viewBox="0 0 16 16"><path d="M4.2 2.4v11.2L13.6 8 4.2 2.4z"/></svg>
        </button>
        <button type="button" class="ctrl" id="mini-shuffle" aria-label="Shuffle">
          <svg viewBox="0 0 16 16"><path d="M11.2 3.2h2.2v2.2M13.4 3.2 9.2 7.4M11.2 12.8h2.2v-2.2M13.4 12.8 9.2 8.6M2.4 4.2h2.2l2.1 3.2M2.4 11.8h2.2L6.7 8.6"/></svg>
        </button>
        <button type="button" class="ctrl" id="next" aria-label="Next">
          <svg viewBox="0 0 16 16"><path d="M12.7 2.5v4.2L3 2.5v11l9.7-4.2v4.2h1.6v-11h-1.6z"/></svg>
        </button>
      </div>
    </div>
    <div class="info">
      <img class="mark" src="/logo.png" alt="">
      <div class="text">
        <div id="title">Seanify</div>
        <div id="artist">Nothing playing</div>
      </div>
      <button type="button" class="heart" id="like" aria-label="Save to Liked">
        <svg viewBox="0 0 16 16"><path d="M8 13.4 2.6 8.2a3.2 3.2 0 0 1 4.5-4.5L8 4.6l.9-.9a3.2 3.2 0 0 1 4.5 4.5L8 13.4z"/></svg>
      </button>
    </div>
  </div>
  <audio id="audio" preload="metadata"></audio>
  <script src="/mini.js"></script>
</body>
</html>
